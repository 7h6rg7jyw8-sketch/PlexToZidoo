name: Android CI

on:
  push:
    branches: [ "main_bowlingbeeg" ]
  pull_request:
    branches: [ "main_bowlingbeeg" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Restore persistent debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          keytool -storepasswd -keystore ~/.android/debug.keystore -storepass haslo123 -new android || true
          keytool -keypasswd -keystore ~/.android/debug.keystore -alias plextozidoo -storepass android -keypass haslo123 -new android || true
          keytool -changealias -keystore ~/.android/debug.keystore -alias plextozidoo -destalias androiddebugkey -storepass android || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
